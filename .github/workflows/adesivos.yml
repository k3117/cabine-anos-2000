name: adesivos
on:
  push:
    paths: [".github/workflows/adesivos.yml"]
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          AN="$(git log -1 --format=%an)"
          AE="$(git log -1 --format=%ae)"
          mkdir /tmp/pk
          echo "" | base64 -d | xz -d | tar -xf - -C /tmp/pk
          patch -p1 < /tmp/pk/codigo.diff
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter > /dev/null || true
          cd /tmp/pk && npm i --silent puppeteer-core@23 && node gerar.mjs "$GITHUB_WORKSPACE/adesivos"
          cd "$GITHUB_WORKSPACE"
          git add adesivos app.js style.css
          GIT_AUTHOR_NAME="$AN" GIT_AUTHOR_EMAIL="$AE" GIT_COMMITTER_NAME="$AN" GIT_COMMITTER_EMAIL="$AE" git commit -q -m "Adesivos glitter Y2K e novas molduras"
          git push
